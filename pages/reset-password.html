  <script src="../js/theme-boot.js"></script><script src="../js/runtime-config.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password — Novexa</title><link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/login.css"></head><body class="login-page"><main class="login-shell"><section class="right-panel signup-panel"><div class="panel-head"><div class="eyebrow">Security</div><h2>Set a new password</h2><p>Choose a new password for your Novexa account.</p></div><form id="resetForm"><div class="form-group"><label for="password">New password</label><input id="password" type="password" minlength="6" required placeholder="New password"></div><button class="login-btn" type="submit">Update Password</button></form><div id="resetMessage" class="login-message" hidden></div></section></main><script src="../vendor/supabase.min.js"></script><script src="../js/supabase.js"></script><script>document.getElementById('resetForm').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('resetMessage');m.hidden=false;m.className='login-message info';m.textContent='Updating…';const {error}=await window.supabaseClient.auth.updateUser({password:document.getElementById('password').value});if(error){m.className='login-message error';m.textContent=error.message}else{m.className='login-message success';m.textContent='Password updated. You can now log in.';setTimeout(()=>location.href='login.html',1000)}});</script></body></html>

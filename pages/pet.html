  <script src="../js/theme-boot.js"></script><script src="../js/runtime-config.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Pet — Novexa</title><link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/tool-pages.css"><style>.pet-wrap{display:grid;grid-template-columns:1fr 1fr;gap:18px}.pet-stage{text-align:center;padding:45px;background:linear-gradient(145deg,#faf8ff,#fff);border-radius:20px}.pet-face{font-size:110px;filter:drop-shadow(0 15px 20px rgba(80,55,180,.15));transition:.3s}.pet-face:hover{transform:translateY(-6px) rotate(-2deg)}.pet-card{padding:25px}.pet-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.pet-grid button{position:relative;border:1px solid #e1dceb;background:#fff;border-radius:12px;padding:12px;cursor:pointer;font-size:24px}.pet-grid button.active{border-color:#9c82ff;background:#f5f1ff}.pet-grid button.pro-locked{filter:grayscale(.75);opacity:.7}.pet-grid button.pro-locked:after{content:'PRO';position:absolute;right:4px;top:4px;padding:2px 4px;border-radius:4px;background:#6843f5;color:#fff;font-size:6px;font-weight:900}.xp{height:10px;border-radius:99px;background:#eeeaf6;overflow:hidden}.xp i{display:block;height:100%;background:linear-gradient(90deg,#6843f5,#9a6bff);transition:width .4s}.pet-pro-banner{margin:0 0 15px;padding:11px 12px;border-radius:12px;background:#f4efff;color:#6242db;font-size:10px;line-height:1.5}.pet-pro-banner a{color:#6843f5;font-weight:900}@media(max-width:700px){.pet-wrap{grid-template-columns:1fr}.pet-grid{grid-template-columns:repeat(5,1fr)}}@media(max-width:420px){.pet-grid{grid-template-columns:repeat(3,1fr)}}

</style></head><body class="tool-page"><div id="site-navbar"></div><main class="tool-shell"><div class="tool-hero"><div><span class="tool-eyebrow">AI PET</span><h1>Your study companion</h1><p>Pick a pet, earn XP from focus sessions and celebrate milestones.</p></div><button class="tool-secondary" onclick="location.href='dashboard.html'">← Dashboard</button></div><div class="pet-wrap"><section class="tool-card pet-stage"><div id="petFace" class="pet-face">🦊</div><h2 id="petName">Nova</h2><p id="petMood">Ready to study with you.</p></section><section class="tool-card pet-card"><h2>Choose your pet</h2><div id="petProBanner" class="pet-pro-banner" hidden></div><div id="petGrid" class="pet-grid">
  <script src="../vendor/lucide.min.js"></script>
  <button data-pet="fox">🦊</button><button data-pet="cat">🐱</button><button data-pet="panda">🐼</button><button data-pet="owl">🦉</button><button data-pet="dog">🐶</button><button data-pet="rabbit">🐰</button><button data-pet="tiger">🐯</button><button data-pet="lion">🦁</button><button data-pet="koala">🐨</button><button data-pet="penguin">🐧</button>
</div><h3>Level <span id="level">1</span></h3><div class="xp"><i id="xpBar" style="width:0%"></i></div><p id="xpText">0 / 100 XP</p><p id="cosmetics" class="tool-note"></p><button id="namePet" class="tool-primary">Name your pet</button></section></div></main><script src="../vendor/supabase.min.js"></script><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script>window.NovexaAuth.requireAuth({ returnTo: window.location.href });</script><script src="../js/components/navbar.js"></script><script>
(async()=>{const s=window.supabaseClient,{data}=await s.auth.getUser();if(!data?.user){location.replace('login.html');return}const uid=data.user.id,emoji={fox:'🦊',cat:'🐱',panda:'🐼',owl:'🦉',dog:'🐶',rabbit:'🐰',tiger:'🐯',lion:'🦁',koala:'🐨',penguin:'🐧'};const apiBase=((location.hostname==='localhost'||location.hostname==='127.0.0.1')&&location.port!=='3000')?'http://localhost:3000':'';let plan='basic';try{const r=await window.NovexaAuth.authorizedFetch(`${apiBase}/api/billing/status`,{cache:'no-store'});const d=await r.json();if(r.ok)plan=d.plan==='pro'?'pro':'basic';else{const profile=await s.from('profiles').select('plan,subscription_status,current_period_end,trial_ends_at').eq('user_id',uid).maybeSingle();const p=profile.data;const active=p?.plan==='pro'&&(['active','past_due'].includes(p.subscription_status)||(p.current_period_end&&new Date(p.current_period_end)>new Date()));if(active)plan='pro'}}catch(_){}const freePets=['fox','cat','panda','owl','dog'];const proPets=['rabbit','tiger','lion','koala','penguin'];const unlocked=plan==='pro'?[...freePets,...proPets]:freePets;let pet={user_id:uid,pet_type:'fox',pet_name:'Nova',xp:0,level:1};async function load(){let r=await s.from('pets').select('*').eq('user_id',uid).maybeSingle();if(r.data)pet=r.data;else await s.from('pets').insert(pet);if(!unlocked.includes(pet.pet_type)){pet.pet_type='fox';await s.from('pets').update({pet_type:'fox'}).eq('user_id',uid)}render()}function render(){petFace.textContent=emoji[pet.pet_type]||'🦊';petName.textContent=pet.pet_name;level.textContent=pet.level;xpText.textContent=`${pet.xp%100} / 100 XP`;xpBar.style.width=`${pet.xp%100}%`;petGrid.querySelectorAll('button').forEach(b=>{const allowed=unlocked.includes(b.dataset.pet);b.classList.toggle('active',b.dataset.pet===pet.pet_type);b.classList.toggle('pro-locked',!allowed);b.title=allowed?'Choose this pet':'Pro unlock: advanced pet varieties'});const idle=Date.now()-new Date(pet.last_seen).getTime()>86400000;petMood.textContent=idle?'Yo 😭 I missed you. Let’s lock in.':pet.xp>0?`W energy. ${plan==='pro'?'We’re actually cooking — Pro mode is ON 🔥':'Keep grinding, you got this fr.'}`:'Ready when you are. No pressure — just lock in ⚡';const unlockedCosmetics=[];if(pet.level>=2)unlockedCosmetics.push('Sparkle');if(pet.level>=3)unlockedCosmetics.push('Scholar hat');if(plan==='pro'&&pet.level>=5)unlockedCosmetics.push('Crown');cosmetics.textContent=unlockedCosmetics.length?'Unlocked cosmetics: '+unlockedCosmetics.join(' · '):plan==='pro'?'Reach level 2 to unlock your first Pro cosmetic.':'Reach level 2 to unlock a cosmetic. ';if(plan!=='pro'){petProBanner.hidden=false;petProBanner.innerHTML='Basic includes 5 starter pets. <a href="payment.html?feature=Pro%20AI%20Pet">Upgrade to Pro</a> for 5 additional premium pets, cosmetics, reactions and progression.'}}async function save(){pet.last_seen=new Date().toISOString();await s.from('pets').upsert(pet);render()}petGrid.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(!unlocked.includes(b.dataset.pet)){location.href='payment.html?feature=Pro%20AI%20Pet';return}pet.pet_type=b.dataset.pet;save()};namePet.onclick=()=>{const n=prompt('What should your pet be called?',pet.pet_name);if(n?.trim()){pet.pet_name=n.trim().slice(0,24);save()}};load()})();
</script></body></html>

<!doctype html><html lang="en"><head>
    <link rel="icon" href="../assets/images/novexa-tab-logo.png?v=43.41" type="image/png"><link rel="apple-touch-icon" href="../assets/images/novexa-tab-logo.png?v=43.41"><script src="../js/theme-boot.js"></script><script src="../js/runtime-config.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novexa Admin — Subscriptions</title><link rel="stylesheet" href="../css/global.css"><style>main{max-width:1400px;margin:40px auto;padding:0 24px}.panel{background:var(--card,#111827);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:20px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px;border-bottom:1px solid rgba(127,127,127,.2);white-space:nowrap}th{font-weight:700}.status{font-weight:700}.error{padding:12px;border-radius:10px;background:#4b1f26;color:#fff}</style></head><body><div id="site-navbar"></div><main><h1>Admin · Subscription diagnostics</h1><p>Read-only support view. Saved student content is never deleted by billing state changes.</p><div id="msg"></div><div class="panel"><table><thead><tr><th>User</th><th>Plan</th><th>PayPal subscription</th><th>Status</th><th>Trial end</th><th>Current period end</th><th>Cancellation</th><th>Last webhook</th><th>Last webhook time</th><th>Last update</th><th>Payment failure</th></tr></thead><tbody id="rows"></tbody></table></div></main><script src="../vendor/supabase.min.js"></script><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script src="../js/components/navbar.js"></script><script>(async()=>{const s=await window.NovexaAuth.getValidSession?.();if(!s){location.href='login.html';return}const r=await window.NovexaAuth.authorizedFetch('/api/billing/admin/subscriptions');const d=await r.json();if(!r.ok){document.getElementById('msg').innerHTML='<div class="error">'+(d.error||'Admin access required.')+'</div>';return}document.getElementById('rows').innerHTML=(d.subscriptions||[]).map(x=>`<tr><td>${x.display_name||x.user_id}</td><td>${x.plan||'basic'}</td><td>${x.paypal_subscription_id||'—'}</td><td class="status">${x.paypal_status||x.subscription_status||'—'}</td><td>${x.paypal_trial_end||x.trial_ends_at||'—'}</td><td>${x.current_period_end||'—'}</td><td>${x.paypal_cancel_at_period_end?'Yes':'No'}</td><td>${x.paypal_last_webhook_type||'—'}</td><td>${x.paypal_last_webhook_at||'—'}</td><td>${x.subscription_updated_at||x.updated_at||'—'}</td><td>${x.payment_failure_at||'—'}</td></tr>`).join('')})();</script></body></html>

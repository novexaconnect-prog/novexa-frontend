<!doctype html><html lang="en"><head>
    <link rel="icon" href="../assets/images/novexa-tab-logo.png?v=43.41" type="image/png"><link rel="apple-touch-icon" href="../assets/images/novexa-tab-logo.png?v=43.41">
  <script src="../js/theme-boot.js"></script><script src="../js/runtime-config.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Planner — Novexa</title><link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/tool-pages.css"><script src="../vendor/lucide.min.js"></script></head><body class="tool-page"><div id="site-navbar"></div><main class="tool-shell"><div class="tool-hero"><div><span class="tool-eyebrow">PLANNER</span><h1>Study planner</h1><p>Add your real tasks and exam dates. Nothing is pre-filled.</p></div><button class="tool-secondary" onclick="location.href='dashboard.html'">← Dashboard</button></div><div class="tool-card"><form id="taskForm" class="tool-form"><input id="taskInput" class="tool-input" placeholder="e.g. Revise differentiation" required><input id="taskDate" class="tool-input" type="date"><input id="taskSubject" class="tool-input" placeholder="Subject"><button class="tool-primary">Add task</button></form></div><div class="tool-card"><div id="tasks" class="tool-list"></div></div></main><script src="../vendor/supabase.min.js"></script><script src="../js/supabase.js"></script><script src="../js/components/navbar.js"></script><script>
(async()=>{const s=window.supabaseClient;const {data,error}=await s.auth.getUser();if(error||!data?.user){location.replace('login.html');return}const uid=data.user.id, list=document.getElementById('tasks');let tasks=[];const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){const r=await s.from('planner_tasks').select('*').eq('user_id',uid).order('due_date',{ascending:true});if(r.error){list.innerHTML='<p class="tool-note">Run backend/supabase/novexa_complete.sql in Supabase first.</p>';return}tasks=r.data||[];render()}function render(){list.innerHTML=tasks.length?tasks.map(t=>`<div class="tool-row"><label><input type="checkbox" ${t.completed?'checked':''} data-done="${t.id}"> <b>${esc(t.title)}</b> <small>${esc(t.subject||'')}${t.due_date?' · '+t.due_date:''}</small></label><button class="tool-secondary" data-del="${t.id}">Delete</button></div>`).join(''):'<p class="tool-note">No study tasks yet.</p>';list.querySelectorAll('[data-done]').forEach(c=>c.onchange=async()=>{await s.from('planner_tasks').update({completed:c.checked}).eq('id',c.dataset.done).eq('user_id',uid);load()});list.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await s.from('planner_tasks').delete().eq('id',b.dataset.del).eq('user_id',uid);load()})}document.getElementById('taskForm').onsubmit=async e=>{e.preventDefault();const title=taskInput.value.trim();if(!title)return;const r=await s.from('planner_tasks').insert({user_id:uid,title,due_date:taskDate.value||null,subject:taskSubject.value.trim()||null});if(r.error)alert(r.error.message);else{taskInput.value='';taskDate.value='';taskSubject.value='';load()}};load()})();
</script><script>lucide.createIcons();</script></body></html>

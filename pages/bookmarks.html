<!doctype html><html><head>
    <link rel="icon" href="../assets/images/novexa-tab-logo.png?v=43.41" type="image/png"><link rel="apple-touch-icon" href="../assets/images/novexa-tab-logo.png?v=43.41">
  <script src="../js/theme-boot.js"></script><script src="../js/runtime-config.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookmarks — Novexa</title><link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/tool-pages.css"></head><body class="tool-page"><main class="tool-shell"><div class="tool-hero"><div><span class="tool-eyebrow">SAVED</span><h1>Your bookmarks</h1><p>Keep useful papers and resources in one place.</p></div><button class="tool-secondary" onclick="location.href='dashboard.html'">← Dashboard</button></div><div class="tool-card"><div id="bookmarks" class="tool-list"></div></div><script>const key='novexa_bookmarks';let items=JSON.parse(localStorage.getItem(key)||'[]');const list=document.getElementById('bookmarks');function render(){list.innerHTML=items.length?items.map((x,i)=>'<div class="tool-row"><span>'+x+'</span><button class="tool-secondary" data-i="'+i+'">Remove</button></div>').join(''):'<p class="tool-note">Your bookmarks will appear here when you save papers.</p>';list.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{items.splice(b.dataset.i,1);localStorage.setItem(key,JSON.stringify(items));render()})}render();</script></main></body></html>

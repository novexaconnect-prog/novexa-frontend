  <script src="../js/theme-boot.js"></script><script src="../js/runtime-config.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload Notes — Novexa</title><link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/tool-pages.css"></head><body class="tool-page"><main class="tool-shell"><div class="tool-hero"><div><span class="tool-eyebrow">UPLOAD</span><h1>Upload study files</h1><p>Select PDFs, images or documents to prepare them for your study workflow.</p></div><button class="tool-secondary" onclick="location.href='dashboard.html'">← Dashboard</button></div><div class="tool-card"><input id="fileInput" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.txt,.doc,.docx"><div id="fileList" class="tool-list" style="margin-top:15px"></div><p class="tool-note">Local preview is enabled here. To permanently store files for users, connect this page to Supabase Storage with a bucket and RLS policies.</p></div><script>const input=document.getElementById('fileInput'),list=document.getElementById('fileList');input.onchange=()=>{list.innerHTML=[...input.files].map(f=>'<div class="tool-row"><span>📄 '+f.name+'</span><span class="tool-note">'+Math.round(f.size/1024)+' KB</span></div>').join('')||'<p class="tool-note">No files selected.</p>'}</script></main></body></html>
